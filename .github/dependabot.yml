# Keeps the pinned build inputs current (D43): actions by commit, the
# Dockerfile's FROM image by digest, Go modules. Weekly, and only releases
# that are at least a week old. The Dockerfile frontend, the BuildKit image
# in release.yml and the tool images in ci.yml and release.yml are pinned
# too but updated by hand (docs/decisions.md, D43).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      go-modules:
        patterns: ["*"]
