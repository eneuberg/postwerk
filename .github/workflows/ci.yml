name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race -count=1 ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --build-arg VERSION="${GITHUB_SHA::12}" -t postwerk:ci .
      - name: Smoke test
        run: |
          docker run --rm postwerk:ci version
          docker run --rm postwerk:ci gen-key | grep -Eq '^[0-9]{8}[a-z0-9]{4}:[A-Za-z0-9+/]{43}=$'
          # Without configuration the start must fail with exit status 2.
          set +e; docker run --rm postwerk:ci; status=$?; set -e
          test "$status" -eq 2

  helm:
    runs-on: ubuntu-latest
    env:
      # Pinned by digest: alpine/helm 4.3.1 and kubeconform v0.8.0.
      HELM: alpine/helm:4.3.1@sha256:e3f8d5c462d75470fbb1fce79ad5c20063657096d1f98c0fcea869e2600e2e5e
      KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, render and validate the chart
        run: |
          chart=deploy/helm/postwerk
          helm() { docker run --rm -v "$PWD:/src" -w /src "$HELM" "$@"; }
          # Every egress rule of a NetworkPolicy names its peers ("to" with at
          # least one entry): a rule without them allows every address (D59).
          egress_peers() {
            awk '
              function finish() { if (rule && !peers) bad = 1; rule = 0; peers = 0 }
              /^---/ { finish(); np = 0; eg = 0 }
              /^kind: NetworkPolicy/ { np = 1 }
              np && eg && /^  [^ ]/ { finish(); eg = 0 }
              np && /^  egress:/ { eg = 1; next }
              eg && /^    - / { finish(); rule = 1; sub(/^    - /, "      ") }
              eg && rule && /^      to:[[:space:]]*$/ { getline; if ($0 ~ /^      [ ]*- /) peers = 1 }
              END { finish(); exit bad }
            ' "$1" || { echo "$1: NetworkPolicy egress rule without peers (every address)"; return 1; }
          }
          for values in "" "$chart/ci/full-values.yaml" "$chart/ci/insecure-values.yaml"; do
            args=(); if [ -n "$values" ]; then args=(-f "$values"); fi
            echo "== values: ${values:-defaults}"
            helm lint --strict "$chart" "${args[@]}"
            helm template ci "$chart" --namespace mail "${args[@]}" > rendered.yaml
            docker run --rm -i "$KUBECONFORM" -strict -summary -kubernetes-version 1.34.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              - < rendered.yaml
            egress_peers rendered.yaml
            # Never exposed outside the cluster.
            if grep -Eq 'type: (LoadBalancer|NodePort)|kind: Ingress' rendered.yaml; then
              echo "chart exposes Postwerk outside the cluster"; exit 1
            fi
            # The UI listens on the pod's loopback only and has no port anywhere.
            if grep -A1 'name: POSTWERK_ADMIN_LISTEN' rendered.yaml | grep 'value:' | grep -Ev '"(127\.0\.0\.1:[0-9]+|off)"'; then
              echo "admin listener not on loopback"; exit 1
            fi
            if grep -Eq '(containerPort|port|targetPort): (8081|9081)$' rendered.yaml; then
              echo "chart exposes the UI port"; exit 1
            fi
          done
          # Unsafe combinations must fail to render.
          if helm template ci "$chart" --set tls.enabled=false >/dev/null 2>&1; then
            echo "tls.enabled=false without allowInsecureAuth rendered"; exit 1
          fi
          if helm template ci "$chart" --set ui.port=8080 >/dev/null 2>&1; then
            echo "ui.port on the health port rendered"; exit 1
          fi
          # The API is off by default: no API port anywhere.
          if helm template ci "$chart" | grep -Eq 'POSTWERK_API_LISTEN|name: api$'; then
            echo "API on by default"; exit 1
          fi
          if helm template ci "$chart" --set api.enabled=true --set api.port=8080 >/dev/null 2>&1; then
            echo "api.port on the health port rendered"; exit 1
          fi
          if helm template ci "$chart" --set api.enabled=true --set tls.enabled=false \
              --set tls.allowInsecureAuth=true >/dev/null 2>&1; then
            echo "api.tls without a certificate rendered"; exit 1
          fi
          if helm template ci "$chart" --set sentry.enabled=true --set sentry.minLevel=info >/dev/null 2>&1; then
            echo "sentry.minLevel=info rendered"; exit 1
          fi
          # NetworkPolicy egress: "any address" only when written out (D59).
          helm template ci "$chart" --set sentry.enabled=true > rendered.yaml
          egress_peers rendered.yaml
          for cidr in '0.0.0.0/0' '::/0'; do
            # by default once for the target ports and once for Sentry
            if [ "$(grep -cFx "            cidr: \"$cidr\"" rendered.yaml)" -ne 2 ]; then
              echo "default egress does not list $cidr for the target ports and Sentry"; exit 1
            fi
          done
          # An empty peer list must fail, never render a rule for every address.
          for args in \
              "--set-json networkPolicy.egress.targetCIDRs=[]" \
              "--set networkPolicy.egress.targetCIDRs=null" \
              "--set sentry.enabled=true --set-json networkPolicy.egress.sentry.cidrs=[]" \
              "--set-json networkPolicy.egress.dns.to=[]"; do
            # shellcheck disable=SC2086 # $args holds several flags
            if helm template ci "$chart" $args >/dev/null 2>&1; then
              echo "empty egress peers rendered: $args"; exit 1
            fi
          done
          # The explicit ways out render no rule at all.
          helm template ci "$chart" --set-json 'networkPolicy.egress.targetPorts=[]' \
            --set-json 'networkPolicy.egress.targetCIDRs=[]' > rendered.yaml
          egress_peers rendered.yaml
          if grep -Eq 'port: (587|465)$' rendered.yaml; then
            echo "targetPorts=[] still renders the target rule"; exit 1
          fi
          helm template ci "$chart" --set sentry.enabled=true --set networkPolicy.egress.sentry.enabled=false \
            --set-json 'networkPolicy.egress.sentry.cidrs=[]' > rendered.yaml
          egress_peers rendered.yaml
          if grep -Eq 'port: 443$' rendered.yaml; then
            echo "networkPolicy.egress.sentry.enabled=false still renders the Sentry rule"; exit 1
          fi
