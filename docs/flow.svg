<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-labelledby="t d">
  <title id="t">Postwerk mail flow</title>
  <desc id="d">Applications hand a mail to Postwerk over SMTP. Postwerk stores it, logs the step, and delivers one copy to each target, here Mailjet and Mailpit.</desc>
  <style>
    .card   { fill: #f6f8fa; stroke: #d0d7de; }
    .box    { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .core   { fill: #ffffff; stroke: #0e6f68; stroke-width: 2; }
    .edge   { fill: none; stroke: #8c959f; stroke-width: 1.4; }
    .txt    { fill: #18212b; font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title  { fill: #18212b; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .muted  { fill: #5a6573; font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .log    { fill: #18212b; font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tick   { fill: none; stroke: #0e6f68; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .rule   { stroke: #d0d7de; stroke-width: 1; }
    .disk   { fill: #e6f2f1; stroke: #0e6f68; stroke-width: 1.4; }
    .mail   { fill: #0e6f68; }
    .hl     { fill: none; stroke: #0e6f68; stroke-width: 2; opacity: 0; }

    @media (prefers-color-scheme: dark) {
      .card  { fill: #161b22; stroke: #30363d; }
      .box   { fill: #0d1117; stroke: #6e7681; }
      .core  { fill: #0d1117; stroke: #4cc2b3; }
      .edge  { stroke: #6e7681; }
      .txt, .title, .log { fill: #e5eaf0; }
      .muted { fill: #9aa6b3; }
      .tick  { stroke: #4cc2b3; }
      .rule  { stroke: #30363d; }
      .disk  { fill: #12302d; stroke: #4cc2b3; }
      .mail  { fill: #4cc2b3; }
      .hl    { stroke: #4cc2b3; }
    }

    /* one mail per 5 s loop */
    .in    { opacity: 0; animation: in 5s linear infinite; }
    .outA  { opacity: 0; animation: outA 5s linear infinite; }
    .outB  { opacity: 0; animation: outB 5s linear infinite; }
    .store { animation: store 5s linear infinite; }
    .row1  { animation: row1 5s linear infinite; }
    .row2  { animation: row2 5s linear infinite; }
    .hlA, .hlB { animation: hit 5s linear infinite; }

    @keyframes in {
      0%   { transform: translate(162px, 120px); opacity: 0; }
      3%   { transform: translate(166px, 120px); opacity: 1; }
      24%  { transform: translate(288px, 120px); opacity: 1; }
      27%  { transform: translate(296px, 120px); opacity: 0; }
      100% { transform: translate(296px, 120px); opacity: 0; }
    }
    @keyframes store {
      0%, 25%  { opacity: 0.55; }
      30%, 40% { opacity: 1; }
      48%, 100% { opacity: 0.55; }
    }
    @keyframes row1 {
      0%, 28%  { opacity: 0.18; }
      33%, 90% { opacity: 1; }
      97%, 100% { opacity: 0.18; }
    }
    @keyframes row2 {
      0%, 69%  { opacity: 0.18; }
      74%, 90% { opacity: 1; }
      97%, 100% { opacity: 0.18; }
    }
    @keyframes outA {
      0%, 43% { transform: translate(472px, 120px); opacity: 0; }
      46%  { transform: translate(478px, 117.7px); opacity: 1; }
      68%  { transform: translate(606px, 81.1px); opacity: 1; }
      71%  { transform: translate(612px, 79.4px); opacity: 0; }
      100% { transform: translate(612px, 79.4px); opacity: 0; }
    }
    @keyframes outB {
      0%, 43% { transform: translate(472px, 120px); opacity: 0; }
      46%  { transform: translate(478px, 122.3px); opacity: 1; }
      68%  { transform: translate(606px, 158.9px); opacity: 1; }
      71%  { transform: translate(612px, 160.6px); opacity: 0; }
      100% { transform: translate(612px, 160.6px); opacity: 0; }
    }
    @keyframes hit {
      0%, 68%  { opacity: 0; }
      72%, 86% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .in, .outA, .outB, .store, .row1, .row2, .hlA, .hlB { animation: none; }
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="759" height="239" rx="12"/>

  <!-- edges -->
  <path class="edge" d="M160 60 L290 120 M160 120 L290 120 M160 180 L290 120"/>
  <path class="edge" d="M470 120 L610 80 M470 120 L610 160"/>
  <text class="muted" x="214" y="111" text-anchor="middle">SMTP</text>
  <text class="muted" x="566" y="118" text-anchor="middle">one copy</text>
  <text class="muted" x="566" y="132" text-anchor="middle">per target</text>

  <!-- applications -->
  <rect class="box" x="20" y="42" width="140" height="36" rx="7"/>
  <text class="txt" x="90" y="64.5" text-anchor="middle">web app</text>
  <rect class="box" x="20" y="102" width="140" height="36" rx="7"/>
  <text class="txt" x="90" y="124.5" text-anchor="middle">auth service</text>
  <rect class="box" x="20" y="162" width="140" height="36" rx="7"/>
  <text class="txt" x="90" y="184.5" text-anchor="middle">worker</text>
  <text class="muted" x="90" y="28" text-anchor="middle">applications</text>

  <!-- Postwerk -->
  <rect class="core" x="290" y="40" width="180" height="160" rx="10"/>
  <text class="title" x="380" y="66" text-anchor="middle">Postwerk</text>
  <g class="store">
    <path class="disk" d="M308 86 v16 a12 4 0 0 0 24 0 v-16"/>
    <ellipse class="disk" cx="320" cy="86" rx="12" ry="4"/>
    <text class="muted" x="342" y="98">stored on disk</text>
  </g>
  <line class="rule" x1="304" y1="118" x2="456" y2="118"/>
  <text class="muted" x="306" y="134">event log</text>
  <g class="row1">
    <path class="tick" d="M307 150 l3 3 l6 -7"/>
    <text class="log" x="322" y="154">accepted</text>
  </g>
  <g class="row2">
    <path class="tick" d="M307 170 l3 3 l6 -7"/>
    <text class="log" x="322" y="174">mailjet  handed off</text>
    <path class="tick" d="M307 188 l3 3 l6 -7"/>
    <text class="log" x="322" y="192">mailpit  handed off</text>
  </g>

  <!-- targets -->
  <rect class="box" x="610" y="58" width="130" height="44" rx="7"/>
  <rect class="hl hlA" x="610" y="58" width="130" height="44" rx="7"/>
  <text class="txt" x="675" y="77" text-anchor="middle">Mailjet</text>
  <text class="muted" x="675" y="93" text-anchor="middle">provider</text>
  <rect class="box" x="610" y="138" width="130" height="44" rx="7"/>
  <rect class="hl hlB" x="610" y="138" width="130" height="44" rx="7"/>
  <text class="txt" x="675" y="157" text-anchor="middle">Mailpit</text>
  <text class="muted" x="675" y="173" text-anchor="middle">capture, optional</text>
  <text class="muted" x="675" y="28" text-anchor="middle">targets</text>

  <!-- mails -->
  <circle class="mail in" cx="0" cy="0" r="5"/>
  <circle class="mail outA" cx="0" cy="0" r="5"/>
  <circle class="mail outB" cx="0" cy="0" r="5"/>
</svg>
