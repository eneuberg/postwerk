<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Postwerk</title>
  <style>
    .tile { fill: #0e6f68; }
    .mark { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1f8f84; }
    }
  </style>
  <rect class="tile" x="2" y="2" width="60" height="60" rx="14"/>
  <!-- envelope: one mail in -->
  <rect class="mark" x="9" y="21" width="25" height="19" rx="2.5"/>
  <path class="mark" d="M10 23 L21.5 31.5 L33 23"/>
  <!-- fan-out: one copy per target -->
  <path class="mark" d="M34 30.5 H40 M40 30.5 L50 19.5 M40 30.5 H51 M40 30.5 L50 41.5"/>
  <circle class="dot" cx="52" cy="18" r="3.6"/>
  <circle class="dot" cx="53.5" cy="30.5" r="3.6"/>
  <circle class="dot" cx="52" cy="43" r="3.6"/>
</svg>
