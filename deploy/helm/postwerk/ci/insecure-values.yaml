# Used by CI: cleartext AUTH, no pseudonymization, NetworkPolicy off, UI off, API without TLS.
tls:
  enabled: false
  allowInsecureAuth: true
retention:
  pseudonymizeAfter: "0"
networkPolicy:
  enabled: false
persistence:
  existingClaim: postwerk-data
ui:
  enabled: false
api:
  enabled: true
  tls:
    enabled: false
