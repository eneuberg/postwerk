# Values for the Postwerk chart. Every value is documented in
# docs/kubernetes.md; "recommended" marks a default from
# docs/configuration.md that you should change only with a reason.
#
# Postwerk is a single instance with one SQLite file: the chart always runs
# exactly one replica with the Recreate strategy. It never exposes Postwerk
# outside the cluster: ClusterIP service only, no Ingress, no LoadBalancer,
# no NodePort.

image:
  # The published image, signed with cosign (docs/kubernetes.md, "Image").
  # Set your own registry here for a mirror or your own build.
  repository: ghcr.io/eneuberg/postwerk
  # Empty: the chart's appVersion.
  tag: ""
  # Recommended: pin the image by digest (sha256:...); it wins over tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Overrides for the resource names (default: <release>-postwerk, or the
# release name if it contains "postwerk").
nameOverride: ""
fullnameOverride: ""

# POSTWERK_HOSTNAME: name in the SMTP greeting and in EHLO towards targets.
# Empty: Postwerk's default ("postwerk").
hostname: ""
# POSTWERK_INSTANCE: added to every log line and event.
instance: ""

# Existing Secrets, referenced by name and key. The chart never creates
# secrets; see docs/kubernetes.md for the kubectl commands.
secrets:
  # Senders file (postwerk hash-password). Required.
  senders:
    name: postwerk-senders
    key: senders
  # Store key file (postwerk gen-key). Required while storeEncryption is on.
  storeKey:
    name: postwerk-store-key
    key: store-key
  # Hash key file (postwerk gen-key, a different key). Required while
  # retention.pseudonymizeAfter is not "0".
  hashKey:
    name: postwerk-hash-key
    key: hash-key
  # UI tokens file (postwerk gen-token NAME): start and break-glass access
  # to the UI. Needed for the first login; once accounts with passwords
  # exist in the UI, set name to "" to run without it.
  uiTokens:
    name: postwerk-ui-tokens
    key: tokens
  # API tokens file (postwerk gen-api-token). Required while api.enabled.
  apiTokens:
    name: postwerk-api-tokens
    key: tokens
  # Sentry or GlitchTip DSN, one line. Required while sentry.enabled.
  sentryDsn:
    name: postwerk-sentry
    key: dsn

# STARTTLS on ingress. Recommended: on. Most SMTP clients (Go's net/smtp,
# gomail, PHPMailer, nodemailer with requireTLS) refuse to send a password
# without TLS to anything but localhost.
tls:
  enabled: true
  # Secret of type kubernetes.io/tls with tls.crt and tls.key. With
  # certManager.enabled the chart creates the Certificate that fills it.
  secretName: postwerk-tls
  certManager:
    enabled: false
    # An issuer for an internal CA, for example a cert-manager CA issuer.
    issuerRef:
      name: internal-ca
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 2160h    # 90 days
    renewBefore: 360h  # 15 days
    # Empty: the service names (<svc>, <svc>.<ns>, <svc>.<ns>.svc, <svc>.<ns>.svc.<clusterDomain>).
    dnsNames: []
  # Only with tls.enabled=false: accept AUTH over cleartext. Use it only if
  # the cluster network encrypts traffic between nodes, and write down why.
  allowInsecureAuth: false

clusterDomain: cluster.local

# Delivery targets: every accepted mail goes to each of them.
targets:
  - name: mailjet                 # [a-z0-9_]{1,32}
    url: smtp://in-v3.mailjet.com:587
    # Secret whose key holds "username:password" (one line).
    credentialsSecret:
      name: postwerk-target-mailjet
      key: credentials
    status: mailjet               # removes the sender's X-MJ-CustomID, adds Postwerk's
    optional: false
    retryWindow: ""               # empty: retryWindow below
    onUnknown: ""                 # hold | retry | check; empty: Postwerk's default
    allowRecipients: ""           # e.g. "*@example.test,qa-*@your-domain"
    mailjetTracking: ""           # status mailjet only: off (default; no open/click tracking) | account
    # ConfigMap with a PEM bundle of the CAs this target's certificate comes
    # from (a private relay); they replace the system roots for this target.
    caConfigMap: {}               # e.g. {name: relay-ca, key: ca.crt}

retryWindow: 24h

# A target that rejects the login (535) or cannot be reached goes down: no
# mail is sent to it, a probe (connect and log in, no mail) runs after
# interval, doubling up to maxInterval, until it succeeds. A rejected login
# raises target.down at once; an unreachable target only after
# downAfterProbes probes failed too (0: at once).
targetProbe:
  interval: 30s
  maxInterval: 5m
  downAfterProbes: 1

limits:
  # The smallest message limit of your targets (recommended: 15 MiB, the
  # SIZE Mailjet offers). Ingress accepts this minus the header lines
  # Postwerk adds (docs/configuration.md, "Message size").
  maxMessageBytes: 15728640
  maxRecipients: 50
  maxConnections: 100
  maxInflightBytes: 268435456     # recommended: 256 MiB memory budget for messages being received
  # Free space kept on the data volume (recommended: 64 MiB). Below it new
  # mail gets 452, /readyz fails and a disk.low event is written. "0": off.
  minFreeBytes: 67108864

# Operator signals (docs/design.md, "Alerting"). queue.stale when a target's
# oldest queued mail is older than staleAfter ("0": off); staleRepeat writes
# it again while it stays stale ("0": once per change).
queue:
  staleAfter: 15m                 # recommended
  staleRepeat: "0"

# Postwerk's own shutdown deadline; the grace period must be longer.
shutdownTimeout: 100s
terminationGracePeriodSeconds: 120

# Encryption at rest. Recommended: "on".
storeEncryption: "on"

# Retention, all at the recommended defaults (docs/configuration.md).
retention:
  rawKeepAfterHandoff: "0"        # recommended: delete the message at hand-off
  rawKeepAfterFailure: 72h        # recommended: time for a resend
  rawMaxAge: 7d                   # recommended: hard cap
  pseudonymizeAfter: 30d          # recommended; "0" turns pseudonymization off
  recordRetention: 90d            # recommended
  eventRetention: 90d             # recommended
  secureDelete: "on"              # recommended

# More POSTWERK_* variables, as a list of {name, value}. Unknown POSTWERK_*
# names stop the start, so typos are caught.
extraEnv: []

# Internal web UI (docs/ui.md). It listens on the pod's loopback only
# (127.0.0.1:<port>), so nothing in the cluster can reach it: no Service
# port, no Ingress, no NetworkPolicy rule. Open it with
#   kubectl -n <namespace> port-forward deploy/<release>-postwerk 8081:8081
# which needs the RBAC right "create" on pods/portforward. Sign in with your
# account's name and password, or the first time with a name and token from
# secrets.uiTokens.
ui:
  enabled: true
  port: 8081
  # Extra host names the UI answers to besides localhost, 127.0.0.1 and
  # [::1] (POSTWERK_ADMIN_HOSTS). Not needed with port-forward.
  hosts: []

# JSON query API (docs/api.md) for other applications in the cluster: look
# up what happened to one mail. Off by default. When on, it listens on the
# pod address, gets a port on the ClusterIP Service, and the NetworkPolicy
# lets in only the pods in api.allowFrom (empty: nobody).
api:
  enabled: false
  port: 8082
  # NetworkPolicy peers allowed to call the API, for example
  #   - podSelector: {matchLabels: {app: support-tool}}
  allowFrom: []
  # Host names the API answers to (POSTWERK_API_HOSTS), besides the
  # Service names, which are always allowed.
  hosts: []
  # TLS on the API (bearer tokens cross the pod network). Recommended: on.
  # The certificate comes from a kubernetes.io/tls Secret; empty secretName
  # means the SMTP one (tls.secretName), whose names are the Service names.
  # It is reloaded when the Secret changes.
  tls:
    enabled: true
    secretName: ""

# Error events to Sentry or a Sentry-compatible tool such as GlitchTip
# (docs/kubernetes.md, "Errors to Sentry or GlitchTip"). The DSN comes from
# secrets.sentryDsn. Events carry ids, target, sender login and SMTP code,
# never addresses or content.
sentry:
  enabled: false
  # error (recommended) or warn; warn adds retries, unreachable targets and
  # failed UI logins.
  minLevel: error
  # Accept an http:// DSN, for a GlitchTip inside the cluster on a network
  # that encrypts traffic between nodes. Never for a DSN on the internet.
  allowHTTP: false

service:
  # Expose the HTTP port (8080, /healthz and /readyz) on the Service too, for
  # monitoring. Probes do not need it.
  exposeHTTP: false
  annotations: {}

persistence:
  # The SQLite file lives here. Use a local, block-backed volume
  # (ReadWriteOnce); never a network file system such as NFS.
  existingClaim: ""
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  annotations: {}

# Recommended: plan the memory limit at about 3 × limits.maxInflightBytes
# plus 50 MiB. Go sizes GOMAXPROCS from the CPU limit, and Postwerk runs at
# most that many password checks at once.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

networkPolicy:
  # Recommended: on. Default deny for everything not listed here.
  enabled: true
  # Who may connect to SMTP (2525): NetworkPolicy peers. By default, pods
  # in the same namespace with the label postwerk-client=true.
  smtpFrom:
    - podSelector:
        matchLabels:
          postwerk-client: "true"
  # Who may reach HTTP (8080), for example a monitoring namespace. Probes
  # come from the kubelet on the pod's node, which NetworkPolicy always
  # allows, so they need no entry.
  httpFrom: []
  egress:
    # DNS for target host names. "to" must not be empty.
    dns:
      enabled: true
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # Target ports. Provider IP addresses change, so the default allows these
    # ports to any address, IPv4 and IPv6, written out; narrow targetCIDRs if
    # your provider publishes ranges. An empty targetCIDRs is refused (it
    # would mean every address without saying so); targetPorts: [] drops the
    # rule, for targets reached only through extra.
    targetPorts: [587, 465]
    targetCIDRs: [0.0.0.0/0, "::/0"]
    # Sentry or GlitchTip on HTTPS, only while sentry.enabled. NetworkPolicy
    # knows no host names: narrow the CIDRs to the addresses of your Sentry
    # host if it has fixed ones. Empty cidrs are refused. For a GlitchTip
    # inside the cluster, set enabled: false and add a rule to extra.
    sentry:
      enabled: true
      port: 443
      cidrs: [0.0.0.0/0, "::/0"]
    # More egress rules, for example to an in-cluster capture tool.
    extra: []

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
